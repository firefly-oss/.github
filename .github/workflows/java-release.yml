name: Java Release

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        required: false
        type: string
        default: '25'
      deploy-module:
        description: 'Specific module to deploy (e.g. core-banking-accounts-sdk). Leave empty to deploy the whole project.'
        required: false
        type: string
        default: ''
      destination:
        description: 'github publishes to GitHub Packages. central signs and publishes to Maven Central.'
        required: false
        type: string
        default: github

jobs:
  github-packages:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven

      # Public platform POMs. Installed locally so a 401 from GitHub Packages
      # cannot abort resolution. Jafly 26.10.20+ is on Maven Central.
      - name: Checkout firefly-bom
        if: github.repository != 'firefly-oss/firefly-bom'
        uses: actions/checkout@v4
        with:
          repository: firefly-oss/firefly-bom
          ref: main
          path: .ci/firefly-bom

      - name: Checkout firefly-parent
        if: github.repository != 'firefly-oss/firefly-parent' && github.repository != 'firefly-oss/firefly-bom'
        uses: actions/checkout@v4
        with:
          repository: firefly-oss/firefly-parent
          ref: main
          path: .ci/firefly-parent

      - name: Configure Maven repositories
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github-firefly-oss</id>
                <username>x-access-token</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>central</id>
                <username>${env.SONATYPE_USERNAME}</username>
                <password>${env.SONATYPE_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Install platform POMs
        if: github.repository != 'firefly-oss/firefly-bom'
        run: |
          set -euo pipefail
          mvn -B -ntp -f .ci/firefly-bom/pom.xml install -DskipTests
          if [ -f .ci/firefly-parent/pom.xml ]; then
            mvn -B -ntp -N -f .ci/firefly-parent/pom.xml install -DskipTests
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Sibling SDKs are published into each repository's own GitHub Packages
      # namespace. GITHUB_TOKEN cannot read those packages from another
      # repository, so release builds install the upstream reactors from
      # source, leaves first: libraries, then core, then domain, then experience.
      - name: Install upstream Firefly modules from source
        if: github.repository != 'firefly-oss/firefly-bom' && github.repository != 'firefly-oss/firefly-parent'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import os, re, subprocess
          from pathlib import Path

          current = os.environ["GITHUB_REPOSITORY"].split("/", 1)[1]
          suffixes = ("-sdk", "-interfaces", "-models", "-infra", "-core", "-web")
          # Maven artifact id differs from the GitHub repository name.
          aliases = {
              "core-lending-mortgages": "core-lending-mortgage",
          }

          def repo_for(art: str) -> str:
              base = art
              for suffix in suffixes:
                  if art.endswith(suffix) and len(art) > len(suffix):
                      base = art[: -len(suffix)]
                      break
              return aliases.get(base, base)

          def deps_of(root: Path, repo: str) -> set[str]:
              found = set()
              for pom in root.rglob("pom.xml"):
                  rel = pom.relative_to(root)
                  if "target" in rel.parts or ".ci" in rel.parts:
                      continue
                  text = pom.read_text(encoding="utf-8", errors="replace")
                  text = re.sub(r"<dependencyManagement>.*?</dependencyManagement>", "", text, flags=re.S)
                  for art in re.findall(r"<groupId>\s*io\.fireflysoftware\s*</groupId>\s*<artifactId>\s*([^<\s]+)\s*</artifactId>", text):
                      if art in {"firefly-parent", "firefly-bom"}:
                          continue
                      if repo_for(art) == repo:
                          continue
                      found.add(art)
              return found

          queue = sorted(deps_of(Path("."), current))
          seen = set()
          graph = {}
          while queue:
              art = queue.pop(0)
              repo = repo_for(art)
              if repo in seen or repo == current:
                  continue
              seen.add(repo)
              dest = Path(".ci/upstream") / repo
              print(f"::group::checkout {repo}", flush=True)
              subprocess.check_call([
                  "gh", "repo", "clone", f"firefly-oss/{repo}", str(dest),
                  "--", "--depth", "1", "--branch", "main",
              ])
              print("::endgroup::", flush=True)
              upstream = deps_of(dest, repo)
              graph[repo] = {repo_for(item) for item in upstream}
              graph[repo].discard(current)
              for item in sorted(upstream):
                  queue.append(item)

          pending = {repo: {dep for dep in deps if dep in seen} for repo, deps in graph.items()}
          order = []
          while pending:
              ready = sorted(repo for repo, deps in pending.items() if not deps)
              if not ready:
                  raise SystemExit(f"dependency cycle among {sorted(pending)}")
              for repo in ready:
                  order.append(repo)
                  del pending[repo]
              for deps in pending.values():
                  deps.difference_update(ready)

          for repo in order:
              print(f"::group::install {repo}", flush=True)
              subprocess.check_call([
                  "mvn", "-B", "-ntp", "-f", f".ci/upstream/{repo}/pom.xml",
                  "install", "-Dmaven.test.skip=true", "-DskipOpenApiGen",
              ])
              print("::endgroup::", flush=True)
          PY

      - name: Import the foundation GPG key
        if: inputs.destination == 'central'
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Deploy
        run: |
          set -o pipefail
          SKIP_FLAGS="-Dmaven.test.skip=true -DskipOpenApiGen"
          if [ "${{ inputs.destination }}" = "central" ]; then
            DEPLOY_FLAGS="-Prelease,maven-central -Dopenplatform.repository=${{ github.event.repository.name }}"
          else
            DEPLOY_FLAGS="-DaltDeploymentRepository=github-firefly-oss::https://maven.pkg.github.com/${{ github.repository }}"
          fi

          if [ -n "${{ inputs.deploy-module }}" ]; then
            echo "Deploying aggregate pom + module: ${{ inputs.deploy-module }}"
            mvn -B -ntp install $SKIP_FLAGS -pl :${{ inputs.deploy-module }} -am
            mvn -B -ntp deploy $SKIP_FLAGS -pl .,:${{ inputs.deploy-module }} $DEPLOY_FLAGS \
              2>&1 | tee /tmp/mvn-deploy.log || {
                if grep -Eq "status code: 409|HTTP Status: 409" /tmp/mvn-deploy.log; then
                  echo "::warning::Artifact already exists (409)"
                else
                  echo "::error::Deploy failed"
                  exit 1
                fi
              }
          else
            echo "Deploying entire project"
            mvn -B -ntp deploy $SKIP_FLAGS $DEPLOY_FLAGS \
              2>&1 | tee /tmp/mvn-deploy.log || {
                if grep -Eq "status code: 409|HTTP Status: 409" /tmp/mvn-deploy.log && \
                   [ -z "$(grep -i 'Failed to deploy' /tmp/mvn-deploy.log | grep -v '409' || true)" ]; then
                  echo "::warning::Artifact already exists (409)"
                else
                  echo "::error::Deploy failed"
                  exit 1
                fi
              }
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  post-release:
    needs: [github-packages]
    if: always() && needs.github-packages.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(awk '
            /<parent>/ {inside=1}
            /<\/parent>/ {inside=0; next}
            inside {next}
            /<version>/ {
              gsub(/.*<version>/, "")
              gsub(/<\/version>.*/, "")
              gsub(/^[ \t]+|[ \t]+$/, "")
              if ($0 !~ /^\$\{/) { print; exit }
            }
          ' pom.xml)
          if [ -z "$VERSION" ]; then
            VERSION=$(awk '
              /<parent>/,/<\/parent>/ {
                if (/<version>/) {
                  gsub(/.*<version>/, "")
                  gsub(/<\/version>.*/, "")
                  gsub(/^[ \t]+|[ \t]+$/, "")
                  print
                  exit
                }
              }
            ' pom.xml)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          sleep 2
          for ATTEMPT in 1 2 3; do
            if gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --latest \
              --target "${{ github.sha }}" 2>/dev/null; then
              echo "Release $TAG created successfully"
              exit 0
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists — OK"
              exit 0
            fi
            echo "Attempt $ATTEMPT failed, retrying in 3s..."
            sleep 3
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — OK"
          else
            echo "::warning::Could not create release $TAG after 3 attempts"
          fi
