name: Java Release

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        required: false
        type: string
        default: '25'
      deploy-module:
        description: 'Specific module to deploy (e.g. core-banking-accounts-sdk). Leave empty to deploy the whole project.'
        required: false
        type: string
        default: ''

jobs:
  github-packages:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven

      # Public platform POMs. Installed locally so a 401 from GitHub Packages
      # cannot abort resolution. Jafly 26.10.19+ is on Maven Central.
      - name: Checkout firefly-bom
        if: github.repository != 'firefly-oss/firefly-bom'
        uses: actions/checkout@v4
        with:
          repository: firefly-oss/firefly-bom
          ref: main
          path: .ci/firefly-bom

      - name: Checkout firefly-parent
        if: github.repository != 'firefly-oss/firefly-parent' && github.repository != 'firefly-oss/firefly-bom'
        uses: actions/checkout@v4
        with:
          repository: firefly-oss/firefly-parent
          ref: main
          path: .ci/firefly-parent

      - name: Configure Maven repositories
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github-firefly-oss</id>
                <username>x-access-token</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github-firefly-oss</id>
                    <url>https://maven.pkg.github.com/firefly-oss/firefly-parent</url>
                    <snapshots><enabled>true</enabled><updatePolicy>never</updatePolicy></snapshots>
                    <releases><enabled>true</enabled></releases>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Install platform POMs
        if: github.repository != 'firefly-oss/firefly-bom'
        run: |
          set -euo pipefail
          mvn -B -ntp -f .ci/firefly-bom/pom.xml install -DskipTests
          if [ -f .ci/firefly-parent/pom.xml ]; then
            mvn -B -ntp -N -f .ci/firefly-parent/pom.xml install -DskipTests
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deploy
        run: |
          set -o pipefail
          DEPLOY_REPO="-DaltDeploymentRepository=github-firefly-oss::https://maven.pkg.github.com/${{ github.repository }}"
          SKIP_FLAGS="-Dmaven.test.skip=true -DskipOpenApiGen"

          if [ -n "${{ inputs.deploy-module }}" ]; then
            echo "Deploying aggregate pom + module: ${{ inputs.deploy-module }}"

            # Install dependencies first (also-make pulls in interfaces/models/core)
            mvn -B -ntp install $SKIP_FLAGS -pl :${{ inputs.deploy-module }} -am

            # Deploy aggregate root pom (.) + the named module only.
            # The aggregate pom is required because the named module's pom
            # inherits from it; consumers pulling the SDK need to resolve
            # its parent. -pl .,:X selects the root reactor + module X.
            mvn -B -ntp deploy $SKIP_FLAGS -pl .,:${{ inputs.deploy-module }} $DEPLOY_REPO \
              2>&1 | tee /tmp/mvn-deploy.log || {
                if grep -q "status code: 409" /tmp/mvn-deploy.log; then
                  echo "::warning::Artifact already exists (409)"
                else
                  echo "::error::Deploy failed"
                  exit 1
                fi
              }
          else
            echo "Deploying entire project"
            mvn -B -ntp deploy $SKIP_FLAGS $DEPLOY_REPO \
              2>&1 | tee /tmp/mvn-deploy.log || {
                if grep -q "status code: 409" /tmp/mvn-deploy.log && \
                   [ -z "$(grep -i 'Failed to deploy' /tmp/mvn-deploy.log | grep -v '409' || true)" ]; then
                  echo "::warning::Artifact already exists (409)"
                else
                  echo "::error::Deploy failed"
                  exit 1
                fi
              }
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

  post-release:
    needs: [github-packages]
    if: always() && needs.github-packages.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>//' | sed 's/<\/version>.*//' | xargs)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          sleep 2
          for ATTEMPT in 1 2 3; do
            if gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --latest \
              --target "${{ github.sha }}" 2>/dev/null; then
              echo "Release $TAG created successfully"
              exit 0
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists — OK"
              exit 0
            fi
            echo "Attempt $ATTEMPT failed, retrying in 3s..."
            sleep 3
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — OK"
          else
            echo "::warning::Could not create release $TAG after 3 attempts"
          fi
