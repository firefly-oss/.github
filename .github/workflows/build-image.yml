name: Build Container Image

# Microservice container images are not published. This workflow remains only
# so existing callers exit without building or pushing to GHCR.

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Unused. Kept so existing callers stay valid.'
        required: false
        type: string
        default: '25'
      web-module:
        description: 'Unused. Kept so existing callers stay valid.'
        required: true
        type: string
      image-platform:
        description: 'Unused. Kept so existing callers stay valid.'
        required: false
        type: string
        default: 'linux/arm64'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Skip container image
        run: echo "Container images are not published for firefly-oss microservices."
